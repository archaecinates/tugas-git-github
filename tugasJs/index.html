<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Js - Input Pilihan</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h2>TUGAS 4</h2>
    </header>

    <main>
        <section class="cardForm" id="cardForm">
            <div class="container">
                <label for="nama">Nama</label>
                <input type="text" id="nama" placeholder="Jan Doe">
            </div>
            <div class="container">
                <label for="jumlah">Jumlah Pilihan</label>
                <input type="number" id="jumlah" placeholder="1">
            </div>
            <button type="button" id="btnSubmit">OK</button>
        </section>

        <section class="cardForm" id="inputChoice" hidden>
            <div id="masukkanPilihan"></div>
            <button type="button" id="btnSubmitChoice">OK</button>
        </section>

        <section class="cardForm" id="choiceButton" hidden>
            <div class="container">
                <label for="shape">Tampilkan Pilihan Sebagai</label>
                <select id="shape" onchange="changeShape()">
                    <option value="radio">Radio</option>
                    <option value="dropdown">Drop Down</option>
                </select>
            </div>
            <div class="container">
                <label id="choiceLabel">Pilihan</label>
                <div id="choiceContainer"></div>
            </div>
            <button type="button" id="btnSubmitChoiceButton">OK</button>
        </section>

        <section class="cardForm" id="email" hidden>
            <div class="container">
                <label for="email">Email</label>
                <input type="email" id="emailInput" placeholder="john.doe@gmail.com">
            </div>
            <button type="button" id="btnSubmitEmail">OK</button>
        </section>

        <section class="cardForm" id="result" hidden>
            <p id="resultText"></p>
            <button type="button" id="btnReset">Reset</button>
        </section>
    </main>
   
</body>
</html>
